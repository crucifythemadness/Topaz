; qmllint / Qt QML extension (qmlls) settings for the Problems tab in VS Code.
; Only categories that are noise for this code base are switched off; everything
; else (typos, missing properties, unknown types, ...) still reports.
[Warnings]
; "Unqualified access": implicit use of ids / properties of an enclosing scope
; (root.x inside a Repeater delegate, a delegate root's own properties from its
; children, ...). A style hint that only asks for `pragma ComponentBehavior:
; Bound` plus explicit ids; the code is correct as it is.
UnqualifiedAccess=disable
; "Detected width/height on an item that is managed by a layout": literal
; width/height on children of Row/Column/GridLayout-style layouts. The dialogs
; are laid out the way they are wanted today; converting them to
; Layout.preferredWidth/implicitWidth would change how they are sized.
Quick.LayoutsPositioning=disable
