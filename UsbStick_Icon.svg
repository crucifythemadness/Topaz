<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="usbGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="usbGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background circle badge, same construction as Harddisk_Icon.svg -->
  <circle cx="60" cy="60" r="54" fill="#161B26" stroke="#2B3548" stroke-width="2"/>
  <circle cx="60" cy="60" r="46" fill="#1C2333" />

  <!-- USB Flash Drive Silhouette: grip cap + narrow metal connector tip -->
  <g filter="url(#usbGlowFilter)" stroke="#38BDF8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cap / body the user grips -->
    <rect x="40" y="27" width="40" height="34" rx="7" stroke-width="3" fill="#161B26" fill-opacity="0.5"/>
    <!-- Keyring hole -->
    <circle cx="60" cy="40" r="4" stroke-width="2.5" fill="none"/>
    <!-- Activity indicator -->
    <circle cx="60" cy="53" r="2.5" fill="#38BDF8" stroke="none"/>
    <!-- Metal connector tip -->
    <rect x="49" y="61" width="22" height="32" rx="3" stroke-width="3" fill="#1C2333" fill-opacity="0.6"/>
    <!-- Connector contact lines -->
    <line x1="55" y1="80" x2="55" y2="88" stroke-width="2.5"/>
    <line x1="65" y1="80" x2="65" y2="88" stroke-width="2.5"/>
  </g>
</svg>
