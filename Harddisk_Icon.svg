<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="hddGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background circle badge matching USB logo style -->
  <circle cx="60" cy="60" r="54" fill="#161B26" stroke="#2B3548" stroke-width="2"/>
  <circle cx="60" cy="60" r="46" fill="#1C2333" />

  <!-- Hard Drive / HDD Platter & Chassis Icon Symbol -->
  <g filter="url(#glowFilter)" stroke="#38BDF8" stroke-linecap="round" stroke-linejoin="round">
    <!-- HDD Outer Enclosure / Tray Frame -->
    <rect x="36" y="27" width="48" height="66" rx="6" stroke-width="3" fill="#161B26" fill-opacity="0.5"/>

    <!-- Top Platter Disk (Circular track ring) -->
    <circle cx="60" cy="52" r="18" stroke-width="2.5" fill="none"/>
    <circle cx="60" cy="52" r="6" stroke-width="2.5" fill="#1C2333"/>
    <circle cx="60" cy="52" r="2.5" fill="#38BDF8" stroke="none"/>

    <!-- Actuator Arm & Read/Write Head -->
    <path d="M 74,68 L 65,58" stroke-width="2.5"/>
    <circle cx="74" cy="68" r="3" fill="#38BDF8" stroke="none"/>

    <!-- Bottom Drive Status / Connector Activity Area -->
    <line x1="43" y1="79" x2="63" y2="79" stroke-width="2.5"/>
    <!-- LED Activity Indicator Dot -->
    <circle cx="73" cy="79" r="2" fill="#38BDF8" stroke="none"/>
  </g>
</svg>
